apiVersion: v1
kind: Service
metadata:
  name: kafka-zookeeper-headless
  labels:
    app: zookeeper
spec:
  clusterIP: None
  ports:
  - name: server
    port: 2888
    protocol: TCP
  - name: election 
    port: 3888
    protocol: TCP
  selector:
     app: zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-zookeeper
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 2181
    protocol: TCP
  selector:
     app: zookeeper
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
spec:
  selector:
    matchLabels:
      app: zookeeper
  maxUnavailable: 1

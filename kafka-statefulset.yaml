apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-service
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka-container
        image: liveget/kafka_aarch64:0.0.1
        command: [ "sh", "-c"]
        args:
        - while true; do
            echo -en '\n';
            printenv POD_ID;
            sleep 10;
          done;
        ports:
        - containerPort: 9092
        env:
        - name: POD_ID
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: 10.99.226.99:2181
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://10.105.69.192:9092
      imagePullSecrets:
      - name: regcred

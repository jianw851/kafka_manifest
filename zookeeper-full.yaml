apiVersion: v1
kind: Service
metadata:
  name: zk-service
  labels:
    app: zk-app
spec:
  ports:
  - name: client
    port: 2181
    protocol: TCP
  - name: follower
    port: 2888
    protocol: TCP
  - name: leader
    port: 3888
    protocol: TCP
  selector:
     app: zk-app
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: zk-deployment
spec:
  selector:
    matchLabels:
      app: zk-app
  template:
    metadata:
      labels:
        app: zk-app
    spec:
      containers:
      - name: zk-container
        image: liveget/zookeeper_aarch64:0.0.1
        ports:
        - containerPort: 2181
        env:
        - name: PLACEHOLDER
          value: "nothing"
      imagePullSecrets:
      - name: regcred

apiVersion: v1
kind: Service
metadata:
  name: kafka-zookeeper-headless
  labels:
    app: zookeeper
spec:
  clusterIP: None
  ports:
  - name: client
    port: 2181
    targetPort:
    protocol: TCP
  - name: server
    port: 2888
    targetPort:
    protocol: TCP
  - name: election 
    port: 3888
    targetPort:
    protocol: TCP
  selector:
     app: zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-zookeeper
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 2181
    targetPort: client
    protocol: TCP
  selector:
     app: zookeeper
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
spec:
  selector:
    matchLabels:
      app: zookeeper
  maxUnavailable: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-zookeeper
  labels:
    app: zookeeper
spec:
  serviceName: kafka-zookeeper-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        imagePullPolicy: Always
        image: liveget/zookeeper_aarch64:0.0.2
        ports:
        - name: client
          containerPort: 2181
          protocol: TCP
        - name: server 
          containerPort: 2888
          protocol: TCP
        - name: election
          containerPort: 3888
          protocol: TCP
        command:
        - sh
        - -c
        - "/opt/zookeeper/bin/zkServer.sh \
          --servers=3 \
          --data_dir=/opt/zookeeper/data \
          --data_log_dir=/opt/zookeeper/data_log \
          --conf_dir=/opt/zookeeper/conf \
          --client_port=2181 \
          --election_port=3888 \
          --server_port=2888 \
          --tick_time=2000 \
          --init_limit=10 \
          --sync_limit=5 \
          --heap=3G \
          --max_client_cnxns=60 \
          --snap_retain_count=3 \
          --purge_interval=12 \
          --max_session_timeout=40000 \
          --min_session_timeout=4000 \
          --log_level=INFO \
          start-foreground"
      imagePullSecrets:
      - name: regcred

---
apiVersion: v1
kind: Service
metadata:
  name: schema-headless
  namespace: dev
spec:
  ports:
  - port: 8081
  clusterIP: None
  selector:
    app: schema-registry
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: dev
  labels:
    app: schema-registry
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 8081
    protocol: TCP
  selector:
     app: schema-registry
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry
  namespace: dev
spec:
  serviceName: schema
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      terminationGracePeriodSeconds: 90
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:3.2.0@sha256:ae0a2021a7ac52bdb98dd760850a50d72747a62612f257be92b0698654bac70d
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL
          value: 10.97.166.90:2181
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: registry-0.schema.dev.svc.cluster.local
        - name: SCHEMA_REGISTRY_LISTENERS
          value: http://0.0.0.0:8081
        ports:
        - containerPort: 8081
